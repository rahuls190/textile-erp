<title>Textile ERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a spec-sheet workspace. Left rail of sections, one work surface, a detail panel beside each list.
   Palette: green-biased greys with one deep mill-green accent; amber, blue and red are reserved for state.
   Type: Plex Sans for reading, Plex Sans Condensed for headings and labels, Plex Mono for document numbers. */
:root {
  --bg: #eef2ee; --surface: #ffffff; --surface-2: #e5ece6; --line: #d3dcd4; --line-2: #e3eae4;
  --fg: #15221c; --muted: #58695f; --accent: #166451; --accent-fg: #ffffff; --accent-soft: #d9eae1;
  --ok: #1c7a4b; --ok-soft: #d8efe2; --warn: #8f5a00; --warn-soft: #f9ecc9; --bad: #b1281f; --bad-soft: #f8dcd8; --info: #1d5c9a; --info-soft: #dae8f6;
  --seg-av: #2e9b78; --seg-rs: #4a86c5; --seg-hd: #d9a21f; --seg-rj: #c8493f;
  --f-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-cond: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(20, 40, 30, .06), 0 4px 14px rgba(20, 40, 30, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1612; --surface: #15201a; --surface-2: #1c2a23; --line: #2a3b32; --line-2: #22322a;
    --fg: #e5efe9; --muted: #92a69b; --accent: #5cc6a1; --accent-fg: #06241a; --accent-soft: #1b3a2e;
    --ok: #56c38d; --ok-soft: #173a2a; --warn: #e3b24a; --warn-soft: #3a2f12; --bad: #f08a80; --bad-soft: #43201d; --info: #86b9ee; --info-soft: #1a3250;
    --seg-av: #3fb48e; --seg-rs: #5a97d6; --seg-hd: #d9a21f; --seg-rj: #d9594e; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1612; --surface: #15201a; --surface-2: #1c2a23; --line: #2a3b32; --line-2: #22322a;
  --fg: #e5efe9; --muted: #92a69b; --accent: #5cc6a1; --accent-fg: #06241a; --accent-soft: #1b3a2e;
  --ok: #56c38d; --ok-soft: #173a2a; --warn: #e3b24a; --warn-soft: #3a2f12; --bad: #f08a80; --bad-soft: #43201d; --info: #86b9ee; --info-soft: #1a3250;
  --seg-av: #3fb48e; --seg-rs: #5a97d6; --seg-hd: #d9a21f; --seg-rj: #d9594e; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-sans); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-cond); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: 26px; line-height: 1.15; } h2 { font-size: 18px; } h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
p { margin: 0; } small { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 12.5px; } .num { font-variant-numeric: tabular-nums; } .r { text-align: right; } .neg { color: var(--bad); }
.muted { color: var(--muted); font-size: 12px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  max-width: 1360px; margin: 0 auto; padding-block: 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand b { font-family: var(--f-cond); font-size: 18px; letter-spacing: .02em; display: block; line-height: 1.1; }
.brand small { display: block; font-size: 12px; }
.mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); position: relative; flex: none; }
.mark::before, .mark::after { content: ''; position: absolute; left: 7px; right: 7px; height: 3px; background: var(--accent-fg); border-radius: 2px; }
.mark::before { top: 9px; } .mark::after { top: 18px; box-shadow: 0 -4.5px 0 -0.5px transparent; }
.actor { display: flex; align-items: center; gap: 10px; min-width: 0; }
.actor span { font-family: var(--f-cond); text-transform: uppercase; letter-spacing: .09em; font-size: 11px; color: var(--muted); white-space: nowrap; }
.actor select { max-width: min(360px, 62vw); }

.frame { max-width: 1360px; margin: 0 auto; display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 28px; padding-block: 22px 56px; }
.side { display: flex; flex-direction: column; gap: 2px; align-self: start; position: sticky; top: calc(72px + env(safe-area-inset-top, 0px)); }
.side a { display: block; padding: 9px 12px; border-radius: 8px; color: var(--fg); text-decoration: none; border: 1px solid transparent; }
.side a b { font-family: var(--f-cond); font-weight: 600; font-size: 15px; display: block; letter-spacing: .01em; }
.side a small { font-size: 11.5px; display: block; line-height: 1.3; }
.side a:hover { background: var(--surface-2); }
.side a.on { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.side a.on b { color: var(--accent); }
.reset { margin-top: 14px; font-size: 12px; text-align: left; }
main { min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head p { color: var(--muted); max-width: 62ch; margin-top: 6px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card .sub { color: var(--muted); margin: 4px 0 14px; max-width: 60ch; }
.note { color: var(--muted); font-size: 12.5px; margin: 10px 0; max-width: 62ch; }
.empty { color: var(--muted); padding: 18px; text-align: center; }
.sec { margin: 30px 0 12px; }
.cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; }
.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.detail { position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 110px); overflow: auto; }
.dh { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
.kv span { color: var(--muted); } .kv b { font-weight: 500; text-align: right; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi span { font-family: var(--f-cond); text-transform: uppercase; letter-spacing: .09em; font-size: 11px; color: var(--muted); }
.kpi b { font-family: var(--f-cond); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi small { font-size: 12px; }
.perm { list-style: none; padding: 0; margin: 0 0 4px; display: grid; gap: 4px; }
.perm li { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 7px; font-size: 13.5px; }
.perm li span { font-weight: 600; width: 14px; }
.perm li.yes { background: var(--ok-soft); color: var(--ok); } .perm li.no { background: var(--bad-soft); color: var(--bad); }
.steps { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 6px; }
.steps li { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--ok); }
.steps li.refused { background: var(--bad-soft); border-left-color: var(--bad); }
.steps li.fail { border-left-color: var(--bad); }
.steps .who { font-family: var(--f-cond); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: var(--muted); padding-top: 2px; }
.steps b { font-weight: 500; display: block; } .steps small { display: block; margin-top: 2px; overflow-wrap: anywhere; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-family: var(--f-cond); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
th.r { text-align: right; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tr.pick { cursor: pointer; } tr.pick:hover { background: var(--surface-2); } tr.pick.on { background: var(--accent-soft); }
tr.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
table.mini th, table.mini td { padding: 7px 8px; font-size: 12.5px; }
.acts { white-space: nowrap; display: flex; gap: 6px; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }

.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; text-transform: capitalize; }
.chip.neutral { background: var(--surface-2); color: var(--muted); } .chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.info { background: var(--info-soft); color: var(--info); }
.pending { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; display: grid; gap: 2px; }

button, select, input { font: inherit; color: var(--fg); }
button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer; font-weight: 500; }
button:hover:not(:disabled) { background: var(--surface-2); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); } button.ghost:hover { color: var(--fg); }
button.link { border: 0; background: none; padding: 0 4px; color: var(--accent); text-decoration: underline; font-weight: 400; }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
input:focus, select:focus { border-color: var(--accent); }
.form { display: grid; gap: 10px; } .form h2 { margin-bottom: 2px; }
.form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.form label input, .form label select { color: var(--fg); font-size: 14px; }
.form button[type=submit] { justify-self: start; }
#reason { margin-top: 4px; }

.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i, .bar i { display: block; }
.legend i { width: 12px; height: 12px; border-radius: 3px; }
.av { background: var(--seg-av); } .rs { background: var(--seg-rs); } .hd { background: var(--seg-hd); } .rj { background: var(--seg-rj); }
.rolls { display: grid; gap: 10px; }
.roll { padding: 0; overflow: hidden; }
.rollhead { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 6px 18px; width: 100%; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 14px 18px; align-items: center; }
.rollhead:hover:not(:disabled) { background: var(--surface-2); }
.rollhead .lab { grid-row: 1; } .rollhead .it { grid-row: 2; color: var(--muted); font-weight: 400; font-size: 12.5px; }
.rollhead .bar { grid-column: 2; grid-row: 1 / span 2; } .rollhead .nums { grid-column: 1 / -1; font-weight: 400; font-size: 13px; color: var(--muted); }
.nums b { color: var(--fg); font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.bar i { min-width: 3px; }
.lotpanel { padding: 4px 18px 18px; border-top: 1px solid var(--line-2); background: var(--surface); }
.forms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 8px; }
.forms .form h3 { margin: 12px 0 0; }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }

.bar2 { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); } .bar2 input { max-width: 380px; } .bar2 span { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-family: var(--f-mono); font-size: 11.5px; background: var(--surface-2); border-radius: 5px; padding: 2px 7px; }
.tag.band { background: var(--warn-soft); color: var(--warn); }

#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 50; width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); display: grid; gap: 2px; animation: pop .18s ease-out; }
.toast.bad { border-left-color: var(--bad); } .toast strong { font-family: var(--f-cond); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--ok); }
.toast.bad strong { color: var(--bad); } .toast small { font-family: var(--f-mono); }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } }

#boot { position: fixed; inset: 0; background: var(--bg); display: grid; place-content: center; gap: 14px; text-align: center; z-index: 100; padding: 24px; }
#boot .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); margin: 0 auto; animation: spin 0.9s linear infinite; }
#boot b { font-family: var(--f-cond); font-size: 20px; } #boot p { color: var(--muted); max-width: 44ch; }
#boot.failed .spin { display: none; } #boot.failed #boot-msg { color: var(--bad); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #boot .spin { animation-duration: 3s; } .toast { animation: none; } }

@media (max-width: 1020px) {
  .cols, .split { grid-template-columns: minmax(0, 1fr); } .detail { position: static; max-height: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .forms { grid-template-columns: minmax(0, 1fr); } .two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .frame { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-top: 14px; }
  .side { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  .side a { flex: none; } .side a small { display: none; } .reset { display: none; }
  .rollhead { grid-template-columns: minmax(0, 1fr); } .rollhead .bar { grid-column: 1; grid-row: auto; }
  .steps li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
</style>

<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="boot"><div class="spin" aria-hidden="true"></div><b>Textile ERP</b><p id="boot-msg">Starting…</p><p>The first start takes a few seconds. After that your demo data is kept in this browser.</p></div>
<script type="module" src="app.js"></script>
